[project]
name = "everyvoice-agent"
version = "0.1.0"
description = "EveryVoice LiveKit Inference agent and authenticated token issuer"
requires-python = ">=3.12,<3.15"
dependencies = [
  "livekit-agents==1.8.4",
  "livekit-api==1.2.1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pyjwt>=2.10,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
